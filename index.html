<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Scanner Oneleven MTB</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;color:#111;-webkit-text-size-adjust:100%}
    .wrap{max-width:650px;margin:auto;padding:20px 16px}
    h1{font-size:38px;text-align:center;margin:10px 0 4px;font-weight:800}
    .mainLogo{display:block;width:100%;max-width:520px;height:auto;margin:5px auto 8px}
    .teacher{text-align:center;font-size:25px;font-weight:bold;margin-bottom:20px}
    #reader{display:none;background:#000;border-radius:12px;overflow:hidden}
    #reader video{width:100%!important;height:auto!important;display:block!important}
    .bar{display:flex;gap:10px;margin:16px 0}.bar button{flex:1;white-space:nowrap}
    button{font:inherit;font-size:20px;font-weight:bold;border:0;border-radius:14px;padding:19px 10px;min-height:66px;background:#111;color:#fff;-webkit-appearance:none;appearance:none;touch-action:manipulation}
    button.secondary{background:#fff;color:#111;border:2px solid #222}
    button:disabled{opacity:.55}
    .cameraStart{width:100%;margin:0 0 14px 0;font-size:23px;min-height:74px}
    .status{background:#fff;border-radius:14px;padding:20px 14px;margin:14px 0;text-align:center}
    .count{font-size:29px;font-weight:bold}.last{font-size:23px;margin-top:8px}
    #list{background:#fff;border-radius:14px;padding:8px 14px;margin-top:14px}
    .row{padding:15px 0;border-bottom:1px solid #ddd;min-height:46px;font-size:20px}.row:last-child{border:0}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;align-items:center;justify-content:center;padding:18px}
    .box{background:#fff;border-radius:18px;padding:24px 20px;width:100%;max-width:560px;max-height:88vh;overflow:auto;font-size:21px}
    .box h2{text-align:center;font-size:31px;margin:8px 0 20px}
    .choice{width:100%;margin:9px 0;font-size:21px}.choice.selected{outline:4px solid #e5005a}
    .remove{float:right;background:#b00020;padding:8px 12px;min-height:44px;font-size:18px}
    .error{color:#b00020;font-weight:bold}.ok{color:#087a2f;font-weight:bold}
    input{width:100%;box-sizing:border-box;font-size:31px;padding:16px;text-align:center;border:2px solid #555;border-radius:10px;-webkit-appearance:none;appearance:none}

    #scannerArea{display:none}
    .setupBox{background:#fff;border-radius:18px;padding:20px 16px;margin-top:18px}
    .setupTitle{text-align:center;font-size:25px;font-weight:bold;margin:4px 0 16px}
    .lessonGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .lessonGrid button{font-size:18px;min-height:62px;padding:12px 6px}
    .lessonGrid button.selected{outline:4px solid #e5005a}
    .timeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .timeGrid button{font-size:18px;min-height:55px;padding:10px 5px}
    .timeGrid button.selected{outline:4px solid #e5005a}
    #continueBtn{width:100%;margin-top:18px}
    .lessonInfo{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;text-align:center;font-size:20px;font-weight:bold}
    #paymentBtn{display:none;width:100%;margin:0 0 10px 0;background:#087a2f}
    #expenseBtn,#otherIncomeBtn{display:none;width:100%;margin:0 0 10px 0}
    #expenseBtn{background:#9b1c1c}
    #otherIncomeBtn{background:#1d4ed8}
    .paymentResult{background:#f4f4f4;border-radius:12px;padding:14px;margin:12px 0;text-align:center}
  </style>
</head>

<body>
<div class="wrap">
  <img src="logo%20scanner.png" alt="Oneleven MTB School" class="mainLogo">
  <div class="teacher" id="teacherName">Scanner Oneleven</div>

  <button id="paymentBtn" type="button">REGISTRA PAGAMENTO</button>
  <button id="expenseBtn" type="button">REGISTRA SPESA</button>
  <button id="otherIncomeBtn" type="button">ENTRATE VARIE</button>

  <div id="setupArea" class="setupBox">
    <div class="setupTitle">TIPO DI ATTIVITÀ</div>
    <div id="lessonGrid" class="lessonGrid"></div>

    <div class="setupTitle" style="margin-top:24px">ORARIO INIZIO</div>
    <div id="timeGrid" class="timeGrid"></div>

    <button id="continueBtn" type="button" disabled>CONTINUA</button>
  </div>

  <div id="manualEntryArea" style="display:none">
    <div class="setupBox">
      <div class="setupTitle" id="manualEntryTitle">NUOVA PROVA</div>

      <input type="text" id="manualNome" placeholder="Nome">
      <input type="text" id="manualCognome" placeholder="Cognome">
      <input type="tel" id="manualTelefono" placeholder="Telefono">

      <button id="manualRegisterBtn">REGISTRA</button>
      <button id="manualCancelBtn" class="secondary">ANNULLA</button>
    </div>
  </div>

  <div id="scannerArea">
    <div class="lessonInfo" id="lessonInfo"></div>

    <button id="startCameraBtn" class="cameraStart" type="button">ATTIVA FOTOCAMERA</button>
    <div id="reader"></div>

    <div class="bar">
      <button id="manualBtn" class="secondary" type="button">INSERISCI QR</button>
      <button id="finishBtn" type="button">FINE SCANSIONE</button>
    </div>

    <div class="status">
      <div class="count">Scansionati: <span id="count">0</span></div>
      <div class="last" id="last">Pronto alla scansione</div>
    </div>

    <div id="list"></div>
  </div>
</div>

<div class="overlay" id="modal"><div class="box" id="modalBox"></div></div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbypRKLkU0RPV8I9WrHV6N24bDnecyAdB0p1hZT4VrGNKDBH0bVspKZg750s_HwNjxs/exec';
var TOKEN = new URLSearchParams(location.search).get('token') || '';

var items = [];
var busy = false;
var scanner = null;
var scannerStarted = false;
var callbackSeq = 0;
var manualBusy = false;
var paymentBusy = false;
var paymentTeacher = '';
var paymentId = '';
var paymentStudent = null;
var paymentType = '';
var paymentCollector = '';
var adminBusy=false;
var adminMode='';
var adminData={};
var adminMovementId='';

var qrMap = {};
var elencoQrPronto = false;
var elencoQrCaricamento = false;
var CACHE_QR_KEY = 'oneleven_qr_elenco_v1';

var tipiPL = ['PL IND','PL COLL CLUB','PL FRIEND','PL DOMENICA','PL IND OUT','PL COLL OUT'];

var tipiAttivita = [
  'PROVA',
  'DAILY',
  'IND',
  'COLL >2',
  'COLL <2',
  'CLUB',
  'RACE',
  'OUT >2',
  'OUT <2'
];

var selectedActivity = '';
var selectedTime = '';

function esc(v){
  return String(v || '').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function setLast(t,cls){
  var e=document.getElementById('last');
  e.className='last '+(cls||'');
  e.textContent=t;
}

function normalizzaTesto(v){
  return String(v||'').trim().toLowerCase();
}

function nomeMaestroDaTitolo(){
  var t=String(document.getElementById('teacherName').textContent||'');
  return t.replace(/^Scanner\s+/i,'').trim();
}

function pagamentoAutorizzato(maestro){
  var m=normalizzaTesto(maestro);
  return m==='dario' || m==='brino' || m==='monica' || m==='miriam';
}

function aggiornaPulsantePagamento(){
  paymentTeacher=nomeMaestroDaTitolo();
  var ok=pagamentoAutorizzato(paymentTeacher);
  var ids=['paymentBtn','expenseBtn','otherIncomeBtn'];
  for(var i=0;i<ids.length;i++){
    var b=document.getElementById(ids[i]);
    if(b)b.style.display=ok?'block':'none';
  }
}

function elencoAllieviUnici(){
  var out=[], visti={};
  Object.keys(qrMap).forEach(function(qr){
    var a=qrMap[qr]||{};
    var id=String(a.id||'').trim();
    if(!id || visti[id]) return;
    visti[id]=true;
    out.push(a);
  });
  return out;
}

function nuovoIdPagamento(){
  return 'S-'+Date.now()+'-'+Math.random().toString(36).slice(2,10).toUpperCase();
}

function apriPagamento(){
  if(!pagamentoAutorizzato(nomeMaestroDaTitolo())) return;

  if(!elencoQrPronto){
    showModalHtml(
      '<h2>PAGAMENTO</h2>'+
      '<p style="text-align:center">Elenco allievi non ancora disponibile.</p>'+
      '<button id="payRetryList" class="choice" type="button">AGGIORNA ELENCO</button>'+
      '<button id="payClose" class="choice secondary" type="button">ANNULLA</button>'
    );
    document.getElementById('payRetryList').addEventListener('click',function(){
      aggiornaElencoQr();
      closeModal();
    });
    document.getElementById('payClose').addEventListener('click',closeModal);
    return;
  }

  paymentId='';
  paymentStudent=null;
  paymentType='';
  paymentCollector='';
  cercaAllievoPagamento();
}

function cercaAllievoPagamento(){
  showModalHtml(
    '<h2>REGISTRA PAGAMENTO</h2>'+
    '<p style="text-align:center"><b>Cerca per cognome</b></p>'+
    '<input id="paySearch" type="text" autocomplete="off" placeholder="Iniziali o cognome">'+
    '<button id="paySearchOk" class="choice" type="button">CERCA</button>'+
    '<button id="paySearchCancel" class="choice secondary" type="button">ANNULLA</button>'
  );

  document.getElementById('paySearchOk').addEventListener('click',eseguiRicercaPagamento);
  document.getElementById('paySearchCancel').addEventListener('click',closeModal);
  document.getElementById('paySearch').addEventListener('keydown',function(e){
    if(e.key==='Enter') eseguiRicercaPagamento();
  });

  setTimeout(function(){
    var x=document.getElementById('paySearch');
    if(x)x.focus();
  },120);
}

function eseguiRicercaPagamento(){
  var q=normalizzaTesto(document.getElementById('paySearch').value);
  if(!q){
    alert('Inserisci almeno una lettera del cognome');
    return;
  }

  var all=elencoAllieviUnici();
  var trovati=[];

  for(var i=0;i<all.length;i++){
    var c=normalizzaTesto(all[i].cognome);
    if(c.indexOf(q)===0) trovati.push(all[i]);
  }

  if(!trovati.length){
    alert('Nessun allievo trovato');
    return;
  }

  if(trovati.length===1){
    scegliAllievoPagamento(trovati[0]);
    return;
  }

  var box=document.getElementById('modalBox');
  box.innerHTML='<h2>SCEGLI ALLIEVO</h2>';

  for(var j=0;j<trovati.length;j++){
    (function(a){
      var b=document.createElement('button');
      b.type='button';
      b.className='choice';
      b.textContent=(a.cognome||'')+' '+(a.nome||'')+' — '+(a.destinazione||'');
      b.addEventListener('click',function(){scegliAllievoPagamento(a);});
      box.appendChild(b);
    })(trovati[j]);
  }

  var back=document.createElement('button');
  back.type='button';
  back.className='choice secondary';
  back.textContent='NUOVA RICERCA';
  back.addEventListener('click',cercaAllievoPagamento);
  box.appendChild(back);
}

function scegliAllievoPagamento(a){
  paymentStudent=a;

  showModalHtml(
    '<h2>'+esc((a.nome||'')+' '+(a.cognome||''))+'</h2>'+
    '<p style="text-align:center"><b>SCEGLI TIPO PAGAMENTO</b></p>'+
    '<button id="payCash" class="choice" type="button">CASH</button>'+
    '<button id="payBank" class="choice" type="button">BONIFICO</button>'+
    '<button id="payBackStudent" class="choice secondary" type="button">INDIETRO</button>'
  );

  document.getElementById('payCash').addEventListener('click',function(){
    paymentType='CASH';
    scegliIncassatoDa();
  });
  document.getElementById('payBank').addEventListener('click',function(){
    paymentType='BONIFICO';
    paymentCollector='';
    chiediImportoPagamento();
  });
  document.getElementById('payBackStudent').addEventListener('click',cercaAllievoPagamento);
}

function scegliIncassatoDa(){
  showModalHtml(
    '<h2>CASH</h2>'+
    '<p style="text-align:center"><b>CHI HA INCASSATO?</b></p>'+
    '<button id="payDario" class="choice" type="button">DARIO</button>'+
    '<button id="payBrino" class="choice" type="button">BRINO</button>'+
    '<button id="payBackType" class="choice secondary" type="button">INDIETRO</button>'
  );

  document.getElementById('payDario').addEventListener('click',function(){
    paymentCollector='DARIO'; chiediImportoPagamento();
  });
  document.getElementById('payBrino').addEventListener('click',function(){
    paymentCollector='BRINO'; chiediImportoPagamento();
  });
  document.getElementById('payBackType').addEventListener('click',function(){
    scegliAllievoPagamento(paymentStudent);
  });
}

function chiediImportoPagamento(){
  showModalHtml(
    '<h2>IMPORTO</h2>'+
    '<p style="text-align:center"><b>'+esc(paymentStudent.nome+' '+paymentStudent.cognome)+'</b><br>'+
    esc(paymentType)+(paymentCollector?' — '+esc(paymentCollector):'')+'</p>'+
    '<input id="payAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00">'+
    '<button id="payAmountOk" class="choice" type="button">CONTINUA</button>'+
    '<button id="payAmountBack" class="choice secondary" type="button">INDIETRO</button>'
  );

  document.getElementById('payAmountOk').addEventListener('click',confermaPagamento);
  document.getElementById('payAmountBack').addEventListener('click',function(){
    if(paymentType==='CASH') scegliIncassatoDa();
    else scegliAllievoPagamento(paymentStudent);
  });
  document.getElementById('payAmount').addEventListener('keydown',function(e){
    if(e.key==='Enter') confermaPagamento();
  });

  setTimeout(function(){
    var x=document.getElementById('payAmount');
    if(x)x.focus();
  },120);
}

function importoPagamentoValido(v){
  var t=String(v||'').trim().replace(/\s/g,'').replace(/€/g,'');
  if(t.indexOf(',')>=0){
    t=t.replace(/\./g,'').replace(',','.');
  }
  var n=Number(t);
  return isFinite(n)&&n>0?n:0;
}

function confermaPagamento(){
  var raw=document.getElementById('payAmount').value;
  var n=importoPagamentoValido(raw);

  if(!n){
    alert('Inserisci un importo valido');
    return;
  }

  paymentId=nuovoIdPagamento();

  showModalHtml(
    '<h2>CONFERMA PAGAMENTO</h2>'+
    '<div class="paymentResult">'+
    '<b>'+esc(paymentStudent.nome+' '+paymentStudent.cognome)+'</b><br>'+
    esc(paymentStudent.destinazione||'')+'<br><br>'+
    '<b>'+esc(paymentType)+'</b><br>'+
    (paymentCollector?'Incassato da: <b>'+esc(paymentCollector)+'</b><br>':'')+
    '<span style="font-size:30px"><b>€ '+n.toFixed(2).replace('.',',')+'</b></span>'+
    '</div>'+
    '<button id="payConfirm" class="choice" type="button">REGISTRA PAGAMENTO</button>'+
    '<button id="payCancelConfirm" class="choice secondary" type="button">ANNULLA</button>'
  );

  document.getElementById('payConfirm').addEventListener('click',function(){
    inviaPagamento(n);
  });
  document.getElementById('payCancelConfirm').addEventListener('click',closeModal);
}

function inviaPagamento(importo){
  if(paymentBusy) return;
  paymentBusy=true;

  var b=document.getElementById('payConfirm');
  if(b){b.disabled=true;b.textContent='REGISTRAZIONE...';}

  jsonp(
    {
      azione:'scannerRegistraPagamento',
      id:paymentStudent.id||'',
      nome:paymentStudent.nome||'',
      cognome:paymentStudent.cognome||'',
      destinazione:paymentStudent.destinazione||'',
      tipo:paymentType,
      importo:String(importo),
      incassatoDa:paymentCollector,
      idPagamento:paymentId
    },
    function(r){
      paymentBusy=false;

      if(!r||!r.ok){
        if(b){b.disabled=false;b.textContent='REGISTRA PAGAMENTO';}
        alert(r&&r.messaggio?r.messaggio:'Errore registrazione pagamento');
        return;
      }

      showModalHtml(
        '<div style="text-align:center;font-size:56px;line-height:1;margin:4px 0 18px">✓</div>'+
        '<h2>PAGAMENTO REGISTRATO</h2>'+
        '<p style="text-align:center;font-size:24px;line-height:1.5">'+
        '<b>'+esc(paymentStudent.nome+' '+paymentStudent.cognome)+'</b><br>'+
        esc(paymentType)+' — € '+Number(importo).toFixed(2).replace('.',',')+
        (paymentCollector?'<br>Incassato da: <b>'+esc(paymentCollector)+'</b>':'')+
        (r.duplicato?'<br><span class="error">Pagamento già presente: nessun doppione creato</span>':'')+
        '</p>'+
        '<button id="payNew" class="choice" type="button">NUOVO PAGAMENTO</button>'+
        '<button id="payDone" class="choice secondary" type="button">CHIUDI</button>'
      );

      document.getElementById('payNew').addEventListener('click',function(){
        closeModal();
        apriPagamento();
      });
      document.getElementById('payDone').addEventListener('click',closeModal);
    },
    function(){
      paymentBusy=false;
      if(b){b.disabled=false;b.textContent='REGISTRA PAGAMENTO';}
      alert('Errore di collegamento. Se il pagamento è arrivato a Google, lo stesso ID impedirà il doppione ripremendo REGISTRA PAGAMENTO.');
    }
  );
}


function nuovoIdMovimento(){
  return 'MOV-'+Date.now()+'-'+Math.random().toString(36).slice(2,10).toUpperCase();
}

function dataOggiInput(){
  var d=new Date();
  var y=d.getFullYear();
  var m=String(d.getMonth()+1).padStart(2,'0');
  var g=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+g;
}

function apriSpesa(){
  adminMode='SPESA'; adminData={}; adminMovementId='';
  var cats=[
    'SPESE ASD','ALLENAMENTI TEAM / GARE / TESSERAMENTI','ABBIGLIAMENTO','MERCHANDISING',
    'SPESE BANCARIE','PUBBLICITA / SOCIAL','EVENTI','BICI E ACQUISTO RICAMBI'
  ];
  var h='<h2>REGISTRA SPESA</h2><div class="paymentList">';
  for(var i=0;i<cats.length;i++) h+='<button class="choice adminCat" data-cat="'+esc(cats[i])+'" type="button">'+esc(cats[i])+'</button>';
  h+='</div><button id="adminCancel" class="choice secondary" type="button">ANNULLA</button>';
  showModalHtml(h);
  var bs=document.querySelectorAll('.adminCat');
  for(var j=0;j<bs.length;j++) bs[j].addEventListener('click',function(){adminData.categoria=this.getAttribute('data-cat');chiediDescrizioneAdmin();});
  document.getElementById('adminCancel').addEventListener('click',closeModal);
}

function apriEntrataVaria(){
  adminMode='ENTRATA'; adminData={}; adminMovementId='';
  chiediDescrizioneAdmin();
}

function chiediDescrizioneAdmin(){
  var titolo=adminMode==='SPESA'?'OGGETTO / DESCRIZIONE SPESA':'DESCRIZIONE ENTRATA';
  showModalHtml('<h2>'+titolo+'</h2><input id="adminDesc" type="text" autocomplete="off" placeholder="Descrizione">'+
    '<button id="adminDescOk" class="choice" type="button">CONTINUA</button><button id="adminCancel" class="choice secondary" type="button">ANNULLA</button>');
  document.getElementById('adminDescOk').addEventListener('click',function(){
    var v=String(document.getElementById('adminDesc').value||'').trim(); if(!v){alert('Inserisci una descrizione');return;}
    if(adminMode==='SPESA')adminData.oggetto=v; else adminData.descrizione=v; chiediImportoAdmin();
  });
  document.getElementById('adminCancel').addEventListener('click',closeModal);
  setTimeout(function(){var x=document.getElementById('adminDesc');if(x)x.focus();},100);
}

function chiediImportoAdmin(){
  showModalHtml('<h2>IMPORTO</h2><input id="adminAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00">'+
    '<button id="adminAmountOk" class="choice" type="button">CONTINUA</button><button id="adminCancel" class="choice secondary" type="button">ANNULLA</button>');
  document.getElementById('adminAmountOk').addEventListener('click',function(){
    var n=importoPagamentoValido(document.getElementById('adminAmount').value); if(!n){alert('Inserisci un importo valido');return;}
    adminData.importo=n; scegliMetodoAdmin();
  });
  document.getElementById('adminCancel').addEventListener('click',closeModal);
}

function scegliMetodoAdmin(){
  showModalHtml('<h2>METODO</h2><button id="adminCash" class="choice" type="button">CASH</button>'+ 
    '<button id="adminBank" class="choice" type="button">BANCOMAT / POS / BANK</button><button id="adminCancel" class="choice secondary" type="button">ANNULLA</button>');
  document.getElementById('adminCash').addEventListener('click',function(){adminData.metodo='CASH';scegliCassaAdmin();});
  document.getElementById('adminBank').addEventListener('click',function(){adminData.metodo='BANK';adminData.cassa='';chiediDataAdmin();});
  document.getElementById('adminCancel').addEventListener('click',closeModal);
}

function scegliCassaAdmin(){
  showModalHtml('<h2>CASSA CASH</h2><button id="cashDario" class="choice" type="button">DARIO</button>'+ 
    '<button id="cashBrino" class="choice" type="button">BRINO</button><button id="adminCancel" class="choice secondary" type="button">ANNULLLA</button>');
  document.getElementById('cashDario').addEventListener('click',function(){adminData.cassa='DARIO';chiediDataAdmin();});
  document.getElementById('cashBrino').addEventListener('click',function(){adminData.cassa='BRINO';chiediDataAdmin();});
  document.getElementById('adminCancel').addEventListener('click',closeModal);
}

function chiediDataAdmin(){
  showModalHtml('<h2>DATA</h2><input id="adminDate" type="date" value="'+dataOggiInput()+'">'+
    '<button id="adminDateOk" class="choice" type="button">CONTINUA</button><button id="adminCancel" class="choice secondary" type="button">ANNULLA</button>');
  document.getElementById('adminDateOk').addEventListener('click',function(){
    var v=document.getElementById('adminDate').value; if(!v){alert('Inserisci la data');return;} adminData.data=v; confermaAdmin();
  });
  document.getElementById('adminCancel').addEventListener('click',closeModal);
}

function confermaAdmin(){
  adminMovementId=nuovoIdMovimento();
  var desc=adminMode==='SPESA'?adminData.oggetto:adminData.descrizione;
  var extra=adminMode==='SPESA'?'<b>'+esc(adminData.categoria)+'</b><br>':'';
  showModalHtml('<h2>CONFERMA</h2><div class="paymentResult">'+extra+esc(desc)+'<br>'+esc(adminData.data)+'<br><br><b>'+esc(adminData.metodo)+'</b>'+ 
    (adminData.cassa?'<br>Cassa: <b>'+esc(adminData.cassa)+'</b>':'')+'<br><span style="font-size:30px"><b>€ '+Number(adminData.importo).toFixed(2).replace('.',',')+'</b></span></div>'+

var audioCtx=null;

function unlockAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    var b=audioCtx.createBuffer(1,1,22050);
    var s=audioCtx.createBufferSource();
    s.buffer=b;s.connect(audioCtx.destination);s.start(0);
  }catch(e){}
}

function beepQr(){
  try{
    if(!audioCtx) return;
    if(audioCtx.state==='suspended') audioCtx.resume();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine';o.frequency.value=1150;
    g.gain.setValueAtTime(0.22,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.12);
  }catch(e){}
}

function already(qr){

function jsonp(params,success,failure){
  if(!TOKEN){
    failure(new Error('Link scanner non autorizzato'));
    return;
  }

  callbackSeq++;

  var cb='onelevenCb'+Date.now()+'_'+callbackSeq;
  var s=document.createElement('script');

  var timer=setTimeout(function(){
    cleanup();
    failure(new Error('Tempo di risposta scaduto'));
  },60000);

  function cleanup(){
    clearTimeout(timer);
    try{delete window[cb];}catch(e){window[cb]=undefined;}
    if(s.parentNode)s.parentNode.removeChild(s);
  }

  window[cb]=function(data){
    cleanup();
    success(data);
  };

  params.token=TOKEN;
  params.callback=cb;

  var q=[];

  Object.keys(params).forEach(function(k){
    q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
  });

  s.src=API_URL+'?'+q.join('&');

  s.onerror=function(){
    cleanup();
    failure(new Error('Collegamento al gestionale non riuscito'));
  };

  document.body.appendChild(s);
}

function indicizzaElencoQr(allievi){
  qrMap={};

  if(!Array.isArray(allievi)) allievi=[];

  for(var i=0;i<allievi.length;i++){
    var a=allievi[i]||{};
    var qr=String(a.qr||'').trim();

    if(qr){
      qrMap[qr]=a;
    }
  }

  elencoQrPronto=true;
}

function salvaElencoQrCache(allievi){
  try{
    localStorage.setItem(
      CACHE_QR_KEY,
      JSON.stringify({
        salvatoIl:Date.now(),
        allievi:allievi
      })
    );
  }catch(e){}
}

function caricaElencoQrCache(){
  try{
    var raw=localStorage.getItem(CACHE_QR_KEY);
    if(!raw) return false;

    var cache=JSON.parse(raw);

    if(!cache || !Array.isArray(cache.allievi) || !cache.allievi.length){
      return false;
    }

    indicizzaElencoQr(cache.allievi);
    return true;
  }catch(e){
    return false;
  }
}

function aggiornaElencoQr(){
  if(!TOKEN || elencoQrCaricamento) return;

  elencoQrCaricamento=true;

  jsonp(
    {azione:'scannerElenco'},
    function(r){
      elencoQrCaricamento=false;

      if(!r || !r.ok || !Array.isArray(r.allievi)){
        if(!elencoQrPronto){
          setLast(
            r&&r.messaggio?r.messaggio:'Impossibile caricare elenco allievi',
            'error'
          );
        }
        return;
      }

      indicizzaElencoQr(r.allievi);
      salvaElencoQrCache(r.allievi);

      if(r.maestro){
        document.getElementById('teacherName').textContent='Scanner '+r.maestro;
        document.title='Scanner '+r.maestro+' - Oneleven MTB';
      }
      aggiornaPulsantePagamento();

      if(document.getElementById('scannerArea').style.display!=='none'){
        setLast('Elenco allievi aggiornato - pronto alla scansione','ok');
      }
    },
    function(){
      elencoQrCaricamento=false;

      if(!elencoQrPronto){
        setLast('Impossibile caricare elenco allievi','error');
      }
    }
  );
}

function avviaElencoQr(){
  if(!TOKEN) return;

  var daCache=caricaElencoQrCache();

  if(daCache){
    setLast('Elenco allievi pronto','ok');
  }else{
    setLast('Caricamento elenco allievi...');
  }

  aggiornaElencoQr();
}

function handleQr(qr){
  qr=String(qr||'').trim();

  if(!qr){
    setLast('Inserisci un codice QR valido','error');
    return;
  }

  if(busy)return;

  if(already(qr)){
    setLast('QR '+qr+' già presente','error');
    return;
  }

  if(elencoQrPronto && qrMap[qr]){
    beepQr();
    setLast('QR '+qr+' letto ✓','ok');
    onResolved(qrMap[qr]);
    return;
  }

  busy=true;
  beepQr();
  setLast('Verifica QR '+qr+'...');

  jsonp(
    {azione:'scannerRisolvi',qr:qr},
    onResolved,
    onFail
  );
}

function onFail(e){
  busy=false;
  setLast('Errore: '+(e&&e.message?e.message:e),'error');
}

function onResolved(a){
  busy=false;

  if(!a || !a.qr){
    setLast(a&&a.messaggio?a.messaggio:'QR non riconosciuto','error');
    return;
  }

  if(a.maestro){
    document.getElementById('teacherName').textContent='Scanner '+a.maestro;
    document.title='Scanner '+a.maestro+' - Oneleven MTB';
    aggiornaPulsantePagamento();
  }

  if(already(a.qr)){
    setLast('QR '+a.qr+' già presente','error');
    return;
  }

  if(a.gruppo==='CLUB'){
    addItem(a,'PRESENZA CLUB');
  }
  else if(a.gruppo==='PL'){
    choosePL(a);
  }
  else{
    setLast('Allievo non gestito dallo scanner rapido','error');
  }
}

function startCamera(){
  unlockAudio();

  if(scannerStarted){
    setLast('Fotocamera già attiva','ok');
    return;
  }

  if(typeof Html5Qrcode==='undefined'){
    setLast('Lettore QR non caricato. Usa INSERISCI QR.','error');
    return;
  }

  var btn=document.getElementById('startCameraBtn');

  btn.disabled=true;
  btn.textContent='APERTURA FOTOCAMERA...';
  setLast('Richiesta accesso alla fotocamera...');

  document.getElementById('reader').style.display='block';

  try{
    scanner=new Html5Qrcode('reader');

    scanner.start(
      {facingMode:'environment'},
      {
        fps:20,
        qrbox:{width:300,height:300},
        aspectRatio:1.0,
        disableFlip:true
      },
      function(txt){
        if(!busy)handleQr(txt);
      },
      function(){}
    )
    .then(function(){
      scannerStarted=true;
      btn.style.display='none';
      setLast('Fotocamera attiva - inquadra un QR','ok');
    })
    .catch(function(err){
      document.getElementById('reader').style.display='none';
      btn.disabled=false;
      btn.textContent='RIPROVA FOTOCAMERA';

      setLast(
        'ERRORE FOTOCAMERA: '+
        (err&&err.message?err.message:String(err)),
        'error'
      );
    });

  }catch(err){
    document.getElementById('reader').style.display='none';
    btn.disabled=false;
    btn.textContent='RIPROVA FOTOCAMERA';
    setLast('Errore fotocamera. Usa INSERISCI QR.','error');
  }
}
