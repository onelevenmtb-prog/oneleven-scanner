<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Scanner Oneleven MTB</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;color:#111;-webkit-text-size-adjust:100%}
    .wrap{max-width:650px;margin:auto;padding:20px 16px}
    h1{font-size:38px;text-align:center;margin:10px 0 4px;font-weight:800}
    .mainLogo{display:block;width:100%;max-width:520px;height:auto;margin:5px auto 8px}
    .teacher{text-align:center;font-size:25px;font-weight:bold;margin-bottom:20px}
    #reader{display:none;background:#000;border-radius:12px;overflow:hidden}
    #reader video{width:100%!important;height:auto!important;display:block!important}
    .bar{display:flex;gap:10px;margin:16px 0}.bar button{flex:1;white-space:nowrap}
    button{font:inherit;font-size:20px;font-weight:bold;border:0;border-radius:14px;padding:19px 10px;min-height:66px;background:#111;color:#fff;-webkit-appearance:none;appearance:none;touch-action:manipulation}
    button.secondary{background:#fff;color:#111;border:2px solid #222}
    button:disabled{opacity:.55}
    .cameraStart{width:100%;margin:0 0 14px 0;font-size:23px;min-height:74px}
    .status{background:#fff;border-radius:14px;padding:20px 14px;margin:14px 0;text-align:center}
    .count{font-size:29px;font-weight:bold}.last{font-size:23px;margin-top:8px}
    #list{background:#fff;border-radius:14px;padding:8px 14px;margin-top:14px}
    .row{padding:15px 0;border-bottom:1px solid #ddd;min-height:46px;font-size:20px}.row:last-child{border:0}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;align-items:center;justify-content:center;padding:18px}
    .box{background:#fff;border-radius:18px;padding:24px 20px;width:100%;max-width:560px;max-height:88vh;overflow:auto;font-size:21px}
    .box h2{text-align:center;font-size:31px;margin:8px 0 20px}
    .choice{width:100%;margin:9px 0;font-size:21px}
    .remove{float:right;background:#b00020;padding:8px 12px;min-height:44px;font-size:18px}
    .error{color:#b00020;font-weight:bold}.ok{color:#087a2f;font-weight:bold}
    input{width:100%;box-sizing:border-box;font-size:31px;padding:16px;text-align:center;border:2px solid #555;border-radius:10px;-webkit-appearance:none;appearance:none}

    #scannerArea{display:none}
    .setupBox{background:#fff;border-radius:18px;padding:20px 16px;margin-top:18px}
    .setupTitle{text-align:center;font-size:25px;font-weight:bold;margin:4px 0 16px}
    .lessonGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .lessonGrid button{font-size:18px;min-height:62px;padding:12px 6px}
    .lessonGrid button.selected{outline:4px solid #777}
    .timeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .timeGrid button{font-size:18px;min-height:55px;padding:10px 5px}
    .timeGrid button.selected{outline:4px solid #777}
    #continueBtn{width:100%;margin-top:18px}
    .lessonInfo{background:#fff;border-radius:14px;padding:15px;margin-bottom:14px;text-align:center;font-size:20px;font-weight:bold}
  </style>
</head>

<body>
<div class="wrap">
 <img src="logo%20scanner.png" alt="Oneleven MTB School" class="mainLogo">
  <div class="teacher" id="teacherName">Scanner Oneleven</div>

  <div id="setupArea" class="setupBox">
    <div class="setupTitle">TIPO DI ATTIVITÀ</div>
    <div id="lessonGrid" class="lessonGrid"></div>

    <div class="setupTitle" style="margin-top:24px">ORARIO INIZIO</div>
    <div id="timeGrid" class="timeGrid"></div>

    <button id="continueBtn" type="button" disabled>CONTINUA</button>
  </div>
<div id="manualEntryArea" style="display:none">
  <div class="setupBox">
    <div class="setupTitle" id="manualEntryTitle">NUOVA PROVA</div>

    <input type="text" id="manualNome" placeholder="Nome">
    <input type="text" id="manualCognome" placeholder="Cognome">
    <input type="tel" id="manualTelefono" placeholder="Telefono">

    <button id="manualRegisterBtn">REGISTRA</button>
    <button id="manualCancelBtn" class="secondary">ANNULLA</button>
  </div>
</div>
  <div id="scannerArea">
    <div class="lessonInfo" id="lessonInfo"></div>

    <button id="startCameraBtn" class="cameraStart" type="button">ATTIVA FOTOCAMERA</button>
    <div id="reader"></div>

    <div class="bar">
      <button id="manualBtn" class="secondary" type="button">INSERISCI QR</button>
      <button id="finishBtn" type="button">FINE SCANSIONE</button>
    </div>

    <div class="status">
      <div class="count">Scansionati: <span id="count">0</span></div>
      <div class="last" id="last">Pronto alla scansione</div>
    </div>

    <div id="list"></div>
  </div>
</div>

<div class="overlay" id="modal"><div class="box" id="modalBox"></div></div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbypRKLkU0RPV8I9WrHV6N24bDnecyAdB0p1hZT4VrGNKDBH0bVspKZg750s_HwNjxs/exec';
var TOKEN = new URLSearchParams(location.search).get('token') || '';

var items = [];
var busy = false;
var scanner = null;
var scannerStarted = false;
var callbackSeq = 0;

var tipiPL = ['PL IND','PL COLL CLUB','PL FRIEND','PL DOMENICA','PL IND OUT','PL COLL OUT'];

var tipiAttivita = [
  'PROVA',
  'DAILY',
  'IND',
  'COLL >2',
  'COLL <2',
  'CLUB',
  'RACE',
  'OUT >2',
  'OUT <2'
];

var selectedActivity = '';
var selectedTime = '';

function esc(v){
  return String(v || '').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function setLast(t,cls){
  var e=document.getElementById('last');
  e.className='last '+(cls||'');
  e.textContent=t;
}

function buildController(){
  var lessonGrid=document.getElementById('lessonGrid');

  for(var i=0;i<tipiAttivita.length;i++){
    (function(tipo){
      var b=document.createElement('button');
      b.type='button';
      b.textContent=tipo;
      b.setAttribute('data-activity',tipo);

      b.addEventListener('click',function(){
        selectedActivity=tipo;

        var all=document.querySelectorAll('[data-activity]');
        for(var j=0;j<all.length;j++) all[j].classList.remove('selected');

        this.classList.add('selected');
        checkController();
      });

      lessonGrid.appendChild(b);
    })(tipiAttivita[i]);
  }

  var timeGrid=document.getElementById('timeGrid');

  for(var h=8;h<=18;h++){
    var minuti=(h===18 ? [0] : [0,30]);

    for(var m=0;m<minuti.length;m++){
      (function(hour,minute){
        var hh=hour<10?'0'+hour:String(hour);
        var mm=minute===0?'00':'30';
        var ora=hh+':'+mm;

        var b=document.createElement('button');
        b.type='button';
        b.className='secondary';
        b.textContent=ora;
        b.setAttribute('data-time',ora);

        b.addEventListener('click',function(){
          selectedTime=ora;

          var all=document.querySelectorAll('[data-time]');
          for(var j=0;j<all.length;j++) all[j].classList.remove('selected');

          this.classList.add('selected');
          checkController();
        });

        timeGrid.appendChild(b);
      })(h,minuti[m]);
    }
  }
}

function checkController(){
  document.getElementById('continueBtn').disabled=!(selectedActivity && selectedTime);
}

function enterScanner(){
  if(!selectedActivity || !selectedTime) return;

  document.getElementById('setupArea').style.display='none';

  // PROVA e DAILY usano l'inserimento manuale
  if(selectedActivity === 'PROVA' || selectedActivity === 'DAILY'){
    document.getElementById('scannerArea').style.display='none';
    document.getElementById('manualEntryArea').style.display='block';

    document.getElementById('manualEntryTitle').textContent =
      selectedActivity === 'PROVA' ? 'NUOVA PROVA' : 'NUOVA LEZIONE GIORNALIERA';

    return;
  }

  // Tutte le altre attività mantengono lo scanner normale
  document.getElementById('manualEntryArea').style.display='none';
  document.getElementById('scannerArea').style.display='block';

  document.getElementById('lessonInfo').textContent=
    selectedActivity+' — '+selectedTime;

  setLast('Pronto alla scansione');
}
var audioCtx=null;

function unlockAudio(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    var b=audioCtx.createBuffer(1,1,22050);
    var s=audioCtx.createBufferSource();
    s.buffer=b;s.connect(audioCtx.destination);s.start(0);
  }catch(e){}
}

function beepQr(){
  try{
    if(!audioCtx) return;
    if(audioCtx.state==='suspended') audioCtx.resume();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine';o.frequency.value=1150;
    g.gain.setValueAtTime(0.22,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.12);
  }catch(e){}
}

function render(){
  document.getElementById('count').textContent=items.length;

  var h='';

  for(var i=0;i<items.length;i++){
    var x=items[i];
    h+='<div class="row"><b>'+esc(x.nome+' '+x.cognome)+'</b><br>'+esc(x.tipo)+' <button class="remove" type="button" data-remove="'+i+'">X</button></div>';
  }

  document.getElementById('list').innerHTML=h;

  var buttons=document.querySelectorAll('[data-remove]');

  for(var j=0;j<buttons.length;j++){
    buttons[j].addEventListener('click',function(){
      removeItem(Number(this.getAttribute('data-remove')));
    });
  }
}

function removeItem(i){
  items.splice(i,1);
  render();
}

function already(qr){
  for(var i=0;i<items.length;i++){
    if(items[i].qr===qr) return true;
  }
  return false;
}

function jsonp(params,success,failure){
  if(!TOKEN){
    failure(new Error('Link scanner non autorizzato'));
    return;
  }

  callbackSeq++;

  var cb='onelevenCb'+Date.now()+'_'+callbackSeq;
  var s=document.createElement('script');

  var timer=setTimeout(function(){
    cleanup();
    failure(new Error('Tempo di risposta scaduto'));
  },20000);

  function cleanup(){
    clearTimeout(timer);
    try{delete window[cb];}catch(e){window[cb]=undefined;}
    if(s.parentNode)s.parentNode.removeChild(s);
  }

  window[cb]=function(data){
    cleanup();
    success(data);
  };

  params.token=TOKEN;
  params.callback=cb;

  var q=[];

  Object.keys(params).forEach(function(k){
    q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
  });

  s.src=API_URL+'?'+q.join('&');

  s.onerror=function(){
    cleanup();
    failure(new Error('Collegamento al gestionale non riuscito'));
  };

  document.body.appendChild(s);
}

function handleQr(qr){
  qr=String(qr||'').trim();

  if(!qr){
    setLast('Inserisci un codice QR valido','error');
    return;
  }

  if(busy)return;

  if(already(qr)){
    setLast('QR '+qr+' già presente','error');
    return;
  }

  busy=true;
  beepQr();
  setLast('QR '+qr+' letto ✓','ok');

  jsonp(
    {azione:'scannerRisolvi',qr:qr},
    onResolved,
    onFail
  );
}

function onFail(e){
  busy=false;
  setLast('Errore: '+(e&&e.message?e.message:e),'error');
}

function onResolved(a){
  busy=false;

  if(!a||!a.ok){
    setLast(a&&a.messaggio?a.messaggio:'QR non riconosciuto','error');
    return;
  }

  if(a.maestro){
    document.getElementById('teacherName').textContent='Scanner '+a.maestro;
    document.title='Scanner '+a.maestro+' - Oneleven MTB';
  }

  if(already(a.qr)){
    setLast('QR '+a.qr+' già presente','error');
    return;
  }

  if(a.gruppo==='CLUB'){
    addItem(a,'PRESENZA CLUB');
  }
  else if(a.gruppo==='PL'){
    choosePL(a);
  }
  else{
    setLast('Allievo non gestito dallo scanner rapido','error');
  }
}

function addItem(a,tipo){
  items.push({
    qr:a.qr,
    id:a.id,
    nome:a.nome,
    cognome:a.cognome,
    destinazione:a.destinazione,
    tipo:tipo
  });

  render();
  closeModal();
  setLast(a.nome+' '+a.cognome+' ✓','ok');
}

function choosePL(a){
  var box=document.getElementById('modalBox');

  box.innerHTML=
    '<h2>'+esc(a.nome+' '+a.cognome)+'</h2>'+
    '<p style="text-align:center"><b>SCEGLI IL TIPO DI LEZIONE</b></p>';

  for(var i=0;i<tipiPL.length;i++){
    (function(tipo){
      var b=document.createElement('button');
      b.type='button';
      b.className='choice';
      b.textContent=tipo;

      b.addEventListener('click',function(){
        addItem(a,tipo);
      });

      box.appendChild(b);
    })(tipiPL[i]);
  }

  var ann=document.createElement('button');
  ann.type='button';
  ann.className='choice secondary';
  ann.textContent='ANNULLA';
  ann.addEventListener('click',closeModal);
  box.appendChild(ann);

  document.getElementById('modal').style.display='flex';
}

function showModalHtml(h){
  document.getElementById('modalBox').innerHTML=h;
  document.getElementById('modal').style.display='flex';
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}

function manualQr(){
  showModalHtml(
    '<h2>Inserisci QR</h2>'+
    '<input id="manual" inputmode="numeric" autocomplete="off" placeholder="0001">'+
    '<button id="manualOk" class="choice" type="button">OK</button>'+
    '<button id="manualCancel" class="choice secondary" type="button">ANNULLA</button>'
  );

  document.getElementById('manualOk').addEventListener('click',submitManual);
  document.getElementById('manualCancel').addEventListener('click',closeModal);

  document.getElementById('manual').addEventListener('keydown',function(e){
    if(e.key==='Enter')submitManual();
  });

  setTimeout(function(){
    var m=document.getElementById('manual');
    if(m)m.focus();
  },150);
}

function submitManual(){
  var m=document.getElementById('manual');
  var v=m?m.value:'';
  closeModal();
  handleQr(v);
}

function finishScan(){
  if(!items.length){
    setLast('Nessun allievo scansionato','error');
    return;
  }

  var box=document.getElementById('modalBox');

  box.innerHTML=
    '<h2>RIEPILOGO</h2>'+
    '<p style="text-align:center"><b>'+
    esc(selectedActivity)+' — '+esc(selectedTime)+
    '</b></p>'+
    '<p style="text-align:center"><b>Totale: '+items.length+'</b></p>';

  for(var i=0;i<items.length;i++){
    (function(indice){
      var x=items[indice];
      var r=document.createElement('div');
      r.className='row';

      r.innerHTML=
        '<b>'+esc(x.nome+' '+x.cognome)+'</b><br>'+
        esc(x.tipo)+' ';

      var b=document.createElement('button');
      b.type='button';
      b.className='remove';
      b.textContent='X';

      b.addEventListener('click',function(){
        removeReview(indice);
      });

      r.appendChild(b);
      box.appendChild(r);
    })(i);
  }

  var save=document.createElement('button');
  save.id='saveBtn';
  save.type='button';
  save.className='choice';
  save.textContent='REGISTRA LEZIONE';
  save.addEventListener('click',saveBatch);
  box.appendChild(save);

  var back=document.createElement('button');
  back.type='button';
  back.className='choice secondary';
  back.textContent='TORNA ALLA SCANSIONE';
  back.addEventListener('click',closeModal);
  box.appendChild(back);

  document.getElementById('modal').style.display='flex';
}

function removeReview(i){
  items.splice(i,1);
  render();

  if(items.length)finishScan();
  else closeModal();
}

function saveBatch(){
  var b=document.getElementById('saveBtn');

  if(b){
    b.disabled=true;
    b.textContent='REGISTRAZIONE...';
  }

  /*
    Per sicurezza, in questa prima fase manteniamo
    invariata la registrazione attuale degli allievi.
    Tipo attività e orario verranno collegati al backend
    nel passaggio successivo, dopo il test del controller.
  */
  jsonp(
    {
      azione:'scannerRegistra',
      elementi:JSON.stringify(items)
    },
    doneBatch,
    onBatchFail
  );
}

function onBatchFail(e){
  closeModal();
  setLast(
    'Errore registrazione: '+(e&&e.message?e.message:e),
    'error'
  );
}

function doneBatch(r){
  if(!r||!r.ok){
    closeModal();
    setLast(
      r&&r.messaggio?r.messaggio:'Errore registrazione',
      'error'
    );
    return;
  }

  var n=r.registrati||0;
  var d=r.duplicati||0;

  items.splice(0,items.length);
  render();

  showModalHtml(
    '<div style="text-align:center;font-size:56px;line-height:1;margin:4px 0 18px">✓</div>'+
    '<h2>REGISTRAZIONE COMPLETATA</h2>'+
    '<p style="text-align:center;font-size:27px;line-height:1.4">'+
    'Registrati: <b>'+n+'</b><br>'+
    'Già presenti: <b>'+d+'</b></p>'+
    '<button id="newScan" class="choice" type="button">NUOVA SCANSIONE</button>'+
    '<button id="closeScanner" class="choice secondary" type="button">CHIUDI SCANNER</button>'
  );

  document.getElementById('newScan').addEventListener('click',function(){
    closeModal();
    setLast('Pronto alla scansione');
  });

  document.getElementById('closeScanner').addEventListener('click',function(){
    try{
      if(scannerStarted && scanner){
        scanner.stop().catch(function(){});
      }
    }catch(e){}

    document.body.innerHTML=
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f4f4f4;font-family:Arial,sans-serif">'+
      '<div style="width:100%;max-width:560px;background:#fff;border-radius:18px;padding:34px 22px;text-align:center;box-sizing:border-box">'+
      '<div style="font-size:56px;line-height:1;margin-bottom:18px">✓</div>'+
      '<h1 style="font-size:32px;margin:0 0 14px">SCANNER CHIUSO</h1>'+
      '<p style="font-size:21px;line-height:1.4;margin:0">La registrazione è stata completata.<br>Puoi chiudere questa schermata.</p>'+
      '</div></div>';
  });
}

function startCamera(){
  unlockAudio();

  if(scannerStarted){
    setLast('Fotocamera già attiva','ok');
    return;
  }

  if(typeof Html5Qrcode==='undefined'){
    setLast('Lettore QR non caricato. Usa INSERISCI QR.','error');
    return;
  }

  var btn=document.getElementById('startCameraBtn');

  btn.disabled=true;
  btn.textContent='APERTURA FOTOCAMERA...';
  setLast('Richiesta accesso alla fotocamera...');

  document.getElementById('reader').style.display='block';

  try{
    scanner=new Html5Qrcode('reader');

    scanner.start(
      {facingMode:'environment'},
      {
        fps:20,
        qrbox:{width:300,height:300},
        aspectRatio:1.0,
        disableFlip:true
      },
      function(txt){
        if(!busy)handleQr(txt);
      },
      function(){}
    )
    .then(function(){
      scannerStarted=true;
      btn.style.display='none';
      setLast('Fotocamera attiva - inquadra un QR','ok');
    })
    .catch(function(err){
      document.getElementById('reader').style.display='none';
      btn.disabled=false;
      btn.textContent='RIPROVA FOTOCAMERA';

      setLast(
        'ERRORE FOTOCAMERA: '+
        (err&&err.message?err.message:String(err)),
        'error'
      );
    });

  }catch(err){
    document.getElementById('reader').style.display='none';
    btn.disabled=false;
    btn.textContent='RIPROVA FOTOCAMERA';
    setLast('Errore fotocamera. Usa INSERISCI QR.','error');
  }
}

document.getElementById('continueBtn').addEventListener('click',enterScanner);
document.getElementById('startCameraBtn').addEventListener('click',startCamera);
document.getElementById('manualBtn').addEventListener('click',manualQr);
document.getElementById('finishBtn').addEventListener('click',finishScan);

buildController();
render();

if(!TOKEN){
  setLast('Apri lo scanner dal link personale Oneleven','error');
}
  document.getElementById('manualCancelBtn').addEventListener('click', function(){
  document.getElementById('manualEntryArea').style.display='none';
  document.getElementById('setupArea').style.display='block';

  document.getElementById('manualNome').value='';
  document.getElementById('manualCognome').value='';
  document.getElementById('manualTelefono').value='';
});
document.getElementById('manualRegisterBtn').addEventListener('click', function(){
  const nome = document.getElementById('manualNome').value.trim();
  const cognome = document.getElementById('manualCognome').value.trim();
  const telefono = document.getElementById('manualTelefono').value.trim();

  if(!nome || !cognome || !telefono){
    alert('Inserisci Nome, Cognome e Telefono');
    return;
  }

  jsonp(
    {
      azione:'scannerRegistraManuale',
      tipo:selectedActivity,
      nome:nome,
      cognome:cognome,
      telefono:telefono,
      orario:selectedTime
    },
    function(r){
      if(r && r.ok){
        alert(
          'TEST BACKEND OK\n' +
          r.tipo + ' — ' + r.orario + '\n' +
          r.nome + ' ' + r.cognome + '\n' +
          'Telefono: ' + r.telefono + '\n' +
          'Maestro: ' + r.maestro
        );
      }else{
        alert((r && r.messaggio) ? r.messaggio : 'Errore registrazione');
      }
    },
    function(){
      alert('Errore di collegamento');
    }
  );
});
</script>
</body>
</html>
